name: Build & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Minecraft Mods
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17 & 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            17
            21
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build All Mod Variants (Forge 1.20.1 & NeoForge 1.21.1)
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "Building with tag version: $VERSION"
            ./gradlew build -Pmod_version="$VERSION"
          else
            ./gradlew build
          fi

      - name: List built JAR files
        run: |
          echo "=== Generated Mod Artifacts in build/libs/ ==="
          ls -lh build/libs/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: neoauth-mods
          path: build/libs/*.jar
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built JAR files
        uses: actions/download-artifact@v4
        with:
          name: neoauth-mods
          path: release-jars

      - name: List Release Files
        run: |
          echo "=== Files to be released ==="
          ls -lh release-jars/

      - name: Create or Update GitHub Release
        run: |
          TAG="${{ github.ref_name }}"
          echo "Publishing release for tag: $TAG"
          
          # 檢查 Release 是否已存在
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists - updating assets..."
            gh release upload "$TAG" release-jars/*.jar --clobber
          else
            echo "Release $TAG does not exist - creating new release..."
            gh release create "$TAG" release-jars/*.jar \
              --title "NeoAuthReloaded $TAG" \
              --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
