plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '1.0.17'
}

version = '1.0.0'
group = 'tw.yuaner.neoauth'
base {
    archivesName = 'neoauth'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.41'

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', 'neoauth'
        }
        server {
            server()
            systemProperty 'neoforge.enabledGameTestNamespaces', 'neoauth'
            programArgument '--nogui'
        }
    }

    mods {
        neoauth {
            sourceSet(project.sourceSets.main)
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // MariaDB
    implementation 'org.mariadb.jdbc:mariadb-java-client:3.4.1'
    jarJar(group: 'org.mariadb.jdbc', name: 'mariadb-java-client', version: '[3.4.1,)')

    // HikariCP
    implementation 'com.zaxxer:HikariCP:5.1.0'
    jarJar(group: 'com.zaxxer', name: 'HikariCP', version: '[5.1.0,)')

    // BCrypt
    implementation 'at.favre.lib:bcrypt:0.10.2'
    jarJar(group: 'at.favre.lib', name: 'bcrypt', version: '[0.10.2,)')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
