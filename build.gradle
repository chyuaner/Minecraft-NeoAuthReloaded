plugins {
    id 'base'
}

allprojects {
    group = property('mod_group_id')
    version = property('mod_version')

    repositories {
        mavenCentral()
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.minecraftforge.net' }
    }
}

subprojects {
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}

// 建立建置目標別名任務 (方便指令執行)
tasks.register('buildForge') {
    group = 'build'
    description = '建置 Minecraft 1.20.1 Forge 專用模組'
    dependsOn ':neoauth-forge:build'
}

tasks.register('buildNeoForge') {
    group = 'build'
    description = '建置 Minecraft 1.21.1 NeoForge 專用模組'
    dependsOn ':neoauth-neoforge:build'
}

tasks.register('buildAll') {
    group = 'build'
    description = '同時建置 1.20.1 Forge 與 1.21.1 NeoForge 模組'
    dependsOn ':neoauth-forge:build', ':neoauth-neoforge:build'
}

// 將各子模組產出的 JAR 聚合複製到根目錄的 build/libs/
tasks.register('collectJars', Copy) {
    group = 'build'
    description = '收集所有子模組產出的 JAR 檔案至根目錄 build/libs/'
    dependsOn 'buildAll'
    
    from(project(':neoauth-forge').layout.buildDirectory.dir('libs')) {
        include '*.jar'
        exclude '*-sources.jar', '*-dev.jar'
    }
    from(project(':neoauth-neoforge').layout.buildDirectory.dir('libs')) {
        include '*.jar'
        exclude '*-sources.jar', '*-dev.jar'
    }
    into layout.buildDirectory.dir('libs')
}

build.dependsOn 'collectJars'
