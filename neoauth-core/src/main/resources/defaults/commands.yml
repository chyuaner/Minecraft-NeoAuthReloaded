# ==============================================================================
# NeoAuth 指令設定檔 (commands.yml)
# ==============================================================================

# 未驗證（未登入/未註冊）玩家允許執行的指令清單 (不分大小寫，有無斜線皆可)
unauthenticatedCommands:
  - "/login"
  - "/l"
  - "/register"
  - "/reg"
  - "/help"
  - "/neoauth"

# 當玩家成功登入後自動執行的指令 (支援 {PLAYER} 變數)
onLogin:
  # 由伺服器後台 (Console) 執行的指令
  console: []
  # 以玩家身分執行的指令
  player: []

# 當玩家成功註冊後自動執行的指令 (支援 {PLAYER} 變數)
onRegister:
  console: []
  player: []

# 當玩家登出或斷線時自動執行的指令 (支援 {PLAYER} 變數)
onLogout:
  console: []
  player: []
