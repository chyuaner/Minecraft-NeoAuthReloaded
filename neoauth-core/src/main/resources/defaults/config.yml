# ==============================================================================
# NeoAuthReloaded 主設定檔 (AuthMeReloaded 風格)
# ==============================================================================

DataSource:
  # 資料庫類型 (支援: SQLITE, MARIADB, MYSQL)
  backend: "SQLITE"
  # SQLite 資料庫檔案路徑 (當 backend 為 SQLITE 時生效)
  # 支援相對路徑 (例如: "config/neoauth/neoauth.db" 或跨目錄 "../plugins/AuthMe/authme.db") 與絕對路徑
  sqLiteFile: "config/neoauth/neoauth.db"
  # 資料庫伺服器主機 IP 或域名 (MySQL / MariaDB 使用)
  mySQLHost: "127.0.0.1"
  # 資料庫連接埠 (預設: 3306)
  mySQLPort: "3306"
  # 資料庫名稱 (MySQL / MariaDB 使用)
  mySQLDatabase: "neoauth"
  # 資料庫登入使用者名稱
  mySQLUsername: "root"
  # 資料庫登入密碼
  mySQLPassword: ""
  # 使用者資料表名稱
  mySQLTablename: "neoauth"

  # 是否啟用 SSL 連線 (Connect to MySQL database over SSL)
  mySQLUseSSL: false
  # 是否驗證伺服器憑證 (Verification of server's certificate)
  mySQLCheckServerCertificate: true
  # 是否允許客戶端檢索 RSA 伺服器公鑰 (Authorize client to retrieve RSA server public key)
  mySQLAllowPublicKeyRetrieval: true
  # 自訂 CA 伺服器憑證路徑 (支援相對路徑如 "config/neoauth/ca-cert.pem" 或絕對路徑，留空代表使用 Java 預設信任庫)
  mySQLServerSslCert: ""
  # 自訂客戶端憑證路徑 (雙向 mTLS 認證時使用，留空表示不使用)
  mySQLClientSslCert: ""
  # 自訂客戶端私鑰路徑 (雙向 mTLS 認證時使用，留空表示不使用)
  mySQLClientSslKey: ""

  # 自訂資料庫欄位名稱 (自訂資料表對應，比照 AuthMeReloaded 規範)
  # 主鍵 ID 欄位 (Column of IDs to sort data)
  mySQLColumnId: "id"
  # 玩家帳號名稱欄位 (Column for storing or checking players nickname)
  mySQLColumnName: "username"
  # 玩家真實名稱欄位 (Column for storing or checking players RealName)
  mySQLRealName: "realname"
  # 密碼欄位 (Column for storing players passwords)
  mySQLColumnPassword: "password"
  # 密碼鹽值欄位 (Column for storing players passwords salts, e.g. 'salt')
  mySQLColumnSalt: ""
  # 電子郵件欄位 (Column for storing players emails)
  mySQLColumnEmail: "email"
  # 是否登入狀態欄位 (Column for storing if a player is logged in or not)
  mySQLColumnLogged: "isLogged"
  # Session 狀態欄位 (Column for storing if a player has a valid session or not)
  mySQLColumnHasSession: "hasSession"
  # TOTP 雙層驗證密鑰欄位 (Column for storing a player's TOTP key)
  mySQLtotpKey: "totp"
  # 最後登入 IP 欄位 (Column for storing the player's last IP)
  mySQLColumnIp: "ip"
  # 最後登入時間戳記欄位 (Column for storing players lastlogins)
  mySQLColumnLastLogin: "lastlogin"
  # 註冊時間戳記欄位 (Column storing the registration date)
  mySQLColumnRegisterDate: "regdate"
  # 註冊時 IP 欄位 (Column for storing the IP address at the time of registration)
  mySQLColumnRegisterIp: "regip"
  # 最後離線位置 X 座標欄位 (Column for storing player LastLocation - X)
  mySQLlastlocX: "x"
  # 最後離線位置 Y 座標欄位 (Column for storing player LastLocation - Y)
  mySQLlastlocY: "y"
  # 最後離線位置 Z 座標欄位 (Column for storing player LastLocation - Z)
  mySQLlastlocZ: "z"
  # 最後離線世界名稱欄位 (Column for storing player LastLocation - World Name)
  mySQLlastlocWorld: "world"
  # 最後離線 Yaw 偏航角欄位 (Column for storing player LastLocation - Yaw)
  mySQLlastlocYaw: "yaw"
  # 最後離線 Pitch 俯仰角欄位 (Column for storing player LastLocation - Pitch)
  mySQLlastlocPitch: "pitch"
  # 玩家 UUID 欄位 (Column for storing players uuids, optional)
  mySQLPlayerUUID: "playerUUID"

  # 連線池最大連線數 (Overrides the size of the DB Connection Pool)
  poolSize: 10
  # 連線最大存活時間 (秒)
  maxLifetime: 1800

  # 是否啟用本地 SQLite 備援，當主資料庫 (如 MySQL) 異常時提供最基本的登入功能 (NeoAuthReloaded擴充)
  fallbackToSqLite: false

# 外部系統 / 論壇 / 皮膚站整合選項 (External Board Options)
ExternalBoardOptions:
  # 外部資料庫鹽值欄位名稱 (若使用 SALTED2MD5 或外部系統，可設為 'salt')
  mySQLColumnSalt: ""

settings:
  # 預設提示語言 (支援: zhtw, en，對應 messages/messages_<lang>.yml)
  messagesLanguage: "zhtw"
  
  # 是否允許離線（非官方）玩家在線上模式伺服器進入
  allowOfflinePlayers: true

  # 是否強制保持離線版 UUID (v3) 相容模式 (預設: false) (NeoAuthReloaded擴充)
  # - false: 通過 Mojang 驗證的正版玩家將使用 Mojang 原生 UUID (v4)
  # - true: 所有玩家（包含正版玩家）在伺服器端一律使用固定的離線 UUID (v3) 儲存存檔與插件資料
  #         正版玩家的官方 Skin 造型仍會完整保留，並享有免密碼自動登入功能。
  #         此設定可徹底避免玩家更換啟動器或 Mojang 伺服器異常時存檔被重設或分裂的問題。
  keepOfflineUuidCompatibility: false

  # 是否在離線模式 (online-mode: false) 下啟用動態正版驗證 (預設: true) (NeoAuthReloaded擴充)
  # - true: 伺服器維持離線模式（所有人使用固定離線 UUID v3，存檔不重設、皮膚 100% 正常相容 SkinRestorer），
  #         但進服時會動態向正版客戶端發起 Mojang 密鑰握手驗證，正版驗證成功後直接享有「免密碼自動登入」！
  # - false: 關閉動態正版驗證，所有玩家一律視為離線玩家要求密碼登入。
  dynamicPremiumVerification: true

  # 動態正版握手超時時間（秒，預設: 7） (NeoAuthReloaded擴充)
  # - 若正版客戶端或 Mojang 伺服器在設定時間內未回應，將自動先放行進入遊戲並提示密碼登入（避免連線卡死）。
  # - 若隨後 Mojang 正版驗證在背景非同步完成通過，且玩家尚未手動登入，系統將即時自動將玩家晉升為「已登入」狀態並解除限制！
  dynamicVerificationTimeout: 7

  # 是否啟用 Mojang 驗證伺服器熔斷保護 (預設: true) (NeoAuthReloaded擴充)
  # - 當伺服器與 Mojang 驗證連線失敗/異常，或客戶端因 Mojang 故障而在握手階段斷線時，
  #   系統將自動開啟熔斷保護，在設定秒數內暫時跳過正版動態握手，改由傳統密碼方式放行進服，
  #   徹底杜絕正版玩家在 Mojang 全球當機時被客戶端拋出「目前無法連線到驗證伺服器」而無法進服的問題！
  circuitBreakerEnabled: true

  # 外部驗證伺服器連線失敗重試次數 (預設: 2) (NeoAuthReloaded擴充)
  # - 當向 Mojang 或第三方 Yggdrasil 伺服器請求驗證發生異常時，將進行重試。
  #   連續失敗達此次數後，才判定為本次連線失敗，並啟動對應的例外或熔斷保護機制。
  retry: 2

  # Mojang 驗證伺服器熔斷冷卻時間（秒，預設: 180） (NeoAuthReloaded擴充)
  # - 當熔斷保護啟動後，在此秒數內所有正版客戶端連線將直接走傳統密碼放行，倒數結束後自動恢復正常正版動態握手。
  circuitBreakerDurationSeconds: 180

  # 自訂第三方 Yggdrasil 外置驗證伺服器 API 網址 (預設: 空字串 "") (NeoAuthReloaded擴充)
  # - 例如: "https://mc8.yuaner.tw/api/yggdrasil" (Blessing Skin, LittleSkin 等自建皮膚站/驗證站)
  # - 若設定此項，NeoAuth 將原生支援「雙向雙驗證」：
  #   優先向 Mojang 官方驗證正版，若非 Mojang 帳號則自動向此外置站查詢 Session 進行認證，
  #   無論是官方正版還是外置正版玩家，皆享有免密碼自動登入體驗！伺服器無需掛載任何 JavaAgent。
  customYggdrasilUrl: ""

  # 註冊相關設定 (AuthMeReloaded 相容結構)
  registration:
    # 是否開放伺服器遊戲內註冊 (Enable registration on the server?)
    enabled: true
    # 每隔 X 秒向未驗證玩家發送一次提示訊息 (0 為不定期提醒)
    messageInterval: 5
    # 是否強制所有玩家必須註冊與登入才能遊玩 (false 則允許未註冊訪客自由遊玩，並自動於資料庫建立空密碼紀錄)
    force: true
    # 玩家成功註冊後是否直接踢出伺服器 (不可與 forceLoginAfterRegister 同時使用)
    forceKickAfterRegister: false
    # 玩家成功註冊後是否強制要求重新執行 /login 進行登入
    forceLoginAfterRegister: false

  # 密碼安全規則 (0 為不限制)
  security:
    # 密碼雜湊方式 (支援: SHA256, SALTED2MD5, SALTEDSHA512, BCRYPT)
    # - SHA256: AuthMe 預設雙重加鹽 SHA-256 ($SHA$salt$hash)
    # - SALTED2MD5: 相容 Discuz!、Phpwind、Blessing Skin 等系統 (MD5(MD5(password) + salt))
    # - SALTEDSHA512: AuthMe 標準雙重加鹽 SHA-512 ($SHA$salt$hash)
    # - BCRYPT: 相容 Blessing Skin 預設算法、Flarum 等系統
    passwordHash: "SHA256"

    # SALTED2MD5 演算法之鹽值長度 (Discuz! / Phpwind 通常為 6)
    doubleMD5SaltLength: 6

    # 密碼最短長度 (0 為不限制)
    minPasswordLength: 0
    # 密碼最長長度 (0 為不限制)
    maxPasswordLength: 0

  # 玩家未驗證時的行為限制
  restrictions:
    # 登入超時時間 (秒，0 為不限制)
    timeout: 90
    # 登入超時的剩餘時間顯示形式 (支援: ACTION_BAR, BOSS_BAR, NONE)
    # - ACTION_BAR: 顯示在快捷欄上方的跑馬燈文字 (預設)
    # - BOSS_BAR: 顯示在螢幕頂部的 BOSS 血條，並隨著時間減少
    # - NONE: 不顯示剩餘時間
    timeoutDisplay: "BOSS_BAR"
    # 輸入錯誤密碼時是否直接踢出
    kickOnWrongPassword: false
    # 最大允許密碼錯誤嘗試次數
    maxLoginTries: 3
    # 是否對未登入玩家施加失明效果 (原地防禦)
    blindness: true
    # 是否對未登入玩家施加緩速與跳躍抑制
    slowness: true
    # 玩家進服時是否顯示 welcome.txt 歡迎文字公告
    displayWelcomeMessage: true


