# ==============================================================================
# NeoAuth Command Help Documentation (English)
# ==============================================================================

help:
  title: "&6--- NeoAuth Help Guide ---"
  commands:
    login:
      usage: "/login <password>"
      description: "Log into the server with your registered password."
    l:
      usage: "/l <password>"
      description: "Alias for /login."
    register:
      usage: "/register <password> [confirmPassword]"
      description: "Register a new password for your account."
    reg:
      usage: "/reg <password> [confirmPassword]"
      description: "Alias for /register."
    changepassword:
      usage: "/changepassword <oldPassword> <newPassword> <confirmPassword>"
      description: "Change the password of the current account."
    cp:
      usage: "/cp <oldPassword> <newPassword> <confirmPassword>"
      description: "Alias for /changepassword."
    logout:
      usage: "/logout"
      description: "Log out from the server."
    email:
      usage: "/email [show | set <email>]"
      description: "View or update your registered email."
    lastlogin:
      usage: "/lastlogin"
      description: "View your last login date and registration date."
    getip:
      usage: "/getip"
      description: "View your current connection IP address."
    neoauth_register:
      usage: "/neoauth register <player> <password>"
      description: "Register account and password for specified player (Admin)."
    neoauth_forcelogin:
      usage: "/neoauth forcelogin [player]"
      description: "Force login specified player or yourself (Admin)."
    neoauth_password:
      usage: "/neoauth password <player> <newPassword>"
      description: "Change password for specified player (Admin)."
    neoauth_lastlogin:
      usage: "/neoauth lastlogin [player]"
      description: "View last login date and IP for specified player (Admin)."
    neoauth_accounts:
      usage: "/neoauth accounts [player/IP]"
      description: "View associated accounts sharing the same IP (Admin)."
    neoauth_email:
      usage: "/neoauth email [show <player> | set <player> <email>]"
      description: "View or set email address for specified player (Admin)."
    neoauth_setemail:
      usage: "/neoauth setemail <player> <email>"
      description: "Set email address for specified player (Admin)."
    neoauth_getip:
      usage: "/neoauth getip <player>"
      description: "Get connection IP for specified player (Admin)."
    neoauth_reload:
      usage: "/neoauth reload"
      description: "Reload all configuration files and messages (Admin)."
    neoauth_version:
      usage: "/neoauth version"
      description: "Display NeoAuth version and runtime info (Admin)."
    neoauth_recent:
      usage: "/neoauth recent"
      description: "Show list of recent logged-in players (Admin)."
