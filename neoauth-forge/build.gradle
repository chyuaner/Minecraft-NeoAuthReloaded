plugins {
    id 'java-library'
    id 'net.neoforged.moddev.legacyforge' version '2.0.143'
}

base {
    archivesName = "${mod_id}-forge-${minecraft_version_forge}"
}

version = "${mod_version}"

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    version = "${forge_version}"

    validateAccessTransformers = true

    runs {
        server {
            server()
            systemProperty 'forge.enabledGameTestNamespaces', "${mod_id}"
            programArgument '--nogui'
        }
        client {
            client()
            systemProperty 'forge.enabledGameTestNamespaces', "${mod_id}"
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(project.sourceSets.main)
            sourceSet(project(':neoauth-core').sourceSets.main)
        }
    }
}

dependencies {
    implementation project(':neoauth-core')

    // MariaDB JDBC 驅動
    implementation "org.mariadb.jdbc:mariadb-java-client:${mariadb_client_version}"
    jarJar(group: 'org.mariadb.jdbc', name: 'mariadb-java-client', version: "[${mariadb_client_version},)")

    // SQLite JDBC 驅動
    implementation "org.xerial:sqlite-jdbc:${sqlite_jdbc_version}"
    jarJar(group: 'org.xerial', name: 'sqlite-jdbc', version: "[${sqlite_jdbc_version},)")

    // HikariCP 連線池
    implementation "com.zaxxer:HikariCP:${hikaricp_version}"
    jarJar(group: 'com.zaxxer', name: 'HikariCP', version: "[${hikaricp_version},)")

    // BCrypt 密碼函式庫
    implementation "at.favre.lib:bcrypt:${bcrypt_version}"
    jarJar(group: 'at.favre.lib', name: 'bcrypt', version: "[${bcrypt_version},)")

    // SnakeYAML 解析函式庫
    implementation "org.yaml:snakeyaml:${snakeyaml_version}"
    jarJar(group: 'org.yaml', name: 'snakeyaml', version: "[${snakeyaml_version},)")
}

def replaceProperties = [
    minecraft_version_forge: minecraft_version_forge,
    forge_version: forge_version,
    mod_id: mod_id,
    mod_name: mod_name,
    mod_version: mod_version,
    mod_authors: mod_authors,
    mod_description: mod_description
]

tasks.named('processResources', ProcessResources).configure {
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', '*.mixins.json']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    from(project(':neoauth-core').sourceSets.main.output)
    manifest {
        attributes([
            'Specification-Title'     : mod_name,
            'Specification-Vendor'    : mod_authors,
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.version,
            'Implementation-Vendor'   : mod_authors,
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
            'MixinConfigs'            : 'neoauth-forge.mixins.json'
        ])
    }
}
