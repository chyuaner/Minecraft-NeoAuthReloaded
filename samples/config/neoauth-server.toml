#NeoAuth 伺服器驗證設定檔 (NeoForge 1.21.1)
[Database]
	#MariaDB 資料庫主機位址 (預設: 127.0.0.1)
	host = "localhost"
	#MariaDB 資料庫連接埠 (預設: 3306)
	port = "3306"
	#MariaDB 資料庫名稱 (預設: neoauth)
	database = "neoauth"
	#MariaDB 資料庫使用者名稱 (預設: root)
	username = "neoauth"
	#MariaDB 資料庫密碼
	password = "a12345"
	#NeoAuth 資料表名稱 (預設: neoauth)
	table = "neoauth"

[Authentication]
	#是否允許離線（盜版）玩家在伺服器 online-mode=true 時進入伺服器
	allowOfflinePlayers = true