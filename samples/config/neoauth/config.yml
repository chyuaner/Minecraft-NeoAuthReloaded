# ==============================================================================
# NeoAuth 主設定檔
# ==============================================================================

DataSource:
  # 資料庫類型 (支援: SQLITE, MARIADB, MYSQL)
  backend: "SQLITE"
  # SQLite 資料庫檔案路徑 (當 backend 為 SQLITE 時生效)
  # 支援相對路徑 (例如: "config/neoauth/neoauth.db" 或跨目錄 "../plugins/AuthMe/authme.db") 與絕對路徑
  sqLiteFile: "config/neoauth/neoauth.db"
  # 資料庫伺服器主機 IP 或域名 (MySQL / MariaDB 使用)
  mySQLHost: "127.0.0.1"
  # 資料庫連接埠 (預設: 3306)
  mySQLPort: "3306"
  # 資料庫名稱
  mySQLDatabase: "neoauth"
  # 資料庫登入使用者名稱
  mySQLUsername: "root"
  # 資料庫登入密碼
  mySQLPassword: ""
  # 使用者資料表名稱
  mySQLTablename: "neoauth"
  # 連線池最大連線數
  poolSize: 10
  # 連線最大存活時間 (秒)
  maxLifetime: 1800

settings:
  # 預設提示語言 (支援: zhtw, en，對應 messages/messages_<lang>.yml)
  messagesLanguage: "zhtw"
  
  # 是否允許離線（非官方）玩家在線上模式伺服器進入
  allowOfflinePlayers: true

  # 是否強制保持離線版 UUID (v3) 相容模式 (預設: false)
  keepOfflineUuidCompatibility: false

  # 註冊相關設定 (AuthMeReloaded 相容結構)
  registration:
    # 是否開放伺服器遊戲內註冊 (Enable registration on the server?)
    enabled: true
    # 每隔 X 秒向未驗證玩家發送一次提示訊息 (0 為不定期提醒)
    messageInterval: 5
    # 是否強制所有玩家必須註冊與登入才能遊玩 (false 則允許未註冊訪客自由遊玩，並自動於資料庫建立空密碼紀錄)
    force: true
    # 玩家成功註冊後是否直接踢出伺服器 (不可與 forceLoginAfterRegister 同時使用)
    forceKickAfterRegister: false
    # 玩家成功註冊後是否強制要求重新執行 /login 進行登入
    forceLoginAfterRegister: false

  # 密碼安全規則
  security:
    # 密碼雜湊方式 (支援: BCRYPT)
    passwordHash: "SHA256"

  