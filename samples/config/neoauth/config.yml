# ==============================================================================
# NeoAuth 主設定檔
# ==============================================================================

DataSource:
  # 資料庫類型 (支援: MARIADB, MYSQL)
  backend: "MARIADB"
  # 資料庫伺服器主機 IP 或域名
  mySQLHost: "127.0.0.1"
  # 資料庫連接埠 (預設: 3306)
  mySQLPort: "3306"
  # 資料庫名稱
  mySQLDatabase: "neoauth"
  # 資料庫登入使用者名稱
  mySQLUsername: "root"
  # 資料庫登入密碼
  mySQLPassword: ""
  # 使用者資料表名稱
  mySQLTablename: "neoauth"
  # 連線池最大連線數
  poolSize: 10
  # 連線最大存活時間 (秒)
  maxLifetime: 1800

settings:
  # 預設提示語言 (支援: zhtw, en，對應 messages/messages_<lang>.yml)
  messagesLanguage: "zhtw"
  
  # 是否允許離線（非官方）玩家在線上模式伺服器進入
  allowOfflinePlayers: true

  # 密碼安全規則
  security:
    # 密碼雜湊方式 (支援: BCRYPT)
    passwordHash: "SHA256"

  